
name: career-elevate
services:
  nginx:
    image: nginx:alpine
    container_name: career-elevate-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - career-elevate-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    image: ${IMAGE_TAG:-}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-elevate-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - career-elevate-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  career-elevate-network:
    driver: bridge
    name: career-elevate-network
